<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>現代漢語刷題 · 精簡版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#ffffff;
    color:#1a1a1a;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:20px;
  }
  .card{
    width:100%;max-width:600px;
    padding:32px 24px;
  }
  .section-title{
    font-family:"Songti SC","STSong","SimSun",serif;
    font-size:2rem;font-weight:700;
    text-align:center;
    letter-spacing:14px;text-indent:14px;
    margin-bottom:8px;
  }
  .section-title::after{
    content:'';display:block;
    width:32px;height:2px;background:#e8e8e8;
    margin:16px auto 0;
  }
  .meta{
    font-size:.75rem;color:#999;
    margin:22px 0 14px;
    display:flex;gap:8px;flex-wrap:wrap;
    justify-content:center;
  }
  .meta span{
    background:#f5f5f5;border-radius:999px;
    padding:4px 10px;
  }
  .question{
    font-size:1.25rem;line-height:1.7;
    font-weight:600;
    margin-bottom:28px;
  }
  .options{
    display:flex;flex-direction:column;gap:11px;
  }
  .option{
    width:100%;text-align:left;
    border:1.5px solid #ededed;border-radius:14px;
    padding:15px 17px;
    font-size:1rem;line-height:1.55;
    background:#fff;color:#1a1a1a;
    cursor:pointer;transition:all .12s ease;
    display:flex;align-items:flex-start;gap:12px;
    font-family:inherit;
  }
  .option:hover:not(:disabled){border-color:#d5d5d5;background:#fafafa}
  .option:active:not(:disabled){transform:scale(.99)}
  .option:disabled{cursor:default}
  .letter{
    flex:none;width:28px;height:28px;border-radius:50%;
    border:1.5px solid #e5e5e5;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:.85rem;color:#666;
    background:#fff;
    transition:all .12s ease;
  }
  .option.correct{border-color:#2e9e65;background:#f0faf4}
  .option.correct .letter{background:#2e9e65;border-color:#2e9e65;color:#fff}
  .option.wrong{border-color:#e04e3d;background:#fdf3f2}
  .option.wrong .letter{background:#e04e3d;border-color:#e04e3d;color:#fff}
  .option.dim{opacity:.45}
  .mark{margin-left:auto;font-weight:700;font-size:1.1rem}
  .correct .mark{color:#2e9e65}
  .wrong .mark{color:#e04e3d}

  .feedback{
    margin-top:22px;padding:18px 20px;border-radius:14px;
    font-size:.95rem;line-height:1.8;
    animation:fadeIn .25s ease both;
  }
  .feedback.good{background:#f0faf4;color:#1f6b42;border:1px solid #cfeadd}
  .feedback.bad{background:#fdf3f2;color:#8a3328;border:1px solid #f3d6d2}
  .feedback .ans{font-weight:700;margin-bottom:6px;font-size:1.05rem}
  .feedback p+p{margin-top:8px}

  .btn{
    width:100%;margin-top:16px;padding:14px 18px;border:none;border-radius:14px;
    font-size:1rem;font-weight:700;cursor:pointer;transition:.12s;
    font-family:inherit;
  }
  .btn-primary{background:#1a1a1a;color:#fff}
  .btn-primary:hover{background:#333}
  .btn-primary:active{transform:scale(.98)}

  .hint{
    text-align:center;margin-top:24px;font-size:.72rem;color:#ccc;
    line-height:1.6;
  }

  .version{
    text-align:center;font-size:.7rem;color:#bbb;margin-top:8px;
  }

  .section-switch{
    text-align:center;margin:-6px 0 14px;font-size:.85rem;
    color:#666;animation:fadeIn .4s ease both;
  }
  .section-switch .tag{
    display:inline-block;padding:4px 12px;border-radius:999px;
    background:#f5f5f5;border:1px solid #eee;
  }

  /* 劃線成語 */
  .idiom{
    color:#c62828;
    text-decoration:underline;
    text-decoration-color:#c62828;
    text-underline-offset:3px;
    font-weight:600;
  }

  /* 訓練模式欄 */
  .mode-bar{
    width:100%;max-width:600px;
    margin-top:28px;
    padding:0 24px 24px;
  }
  .mode-title{
    font-size:.8rem;color:#999;text-align:center;margin-bottom:10px;
    letter-spacing:1px;
  }
  .mode-buttons{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  }
  .mode-btn{
    border:1.5px solid #e5e5e5;background:#fff;color:#555;
    padding:7px 12px;border-radius:999px;
    font-size:.85rem;cursor:pointer;transition:all .12s;
    font-family:inherit;
  }
  .mode-btn:hover{border-color:#bbb;background:#fafafa}
  .mode-btn.active{
    background:#1a1a1a;color:#fff;border-color:#1a1a1a;
  }

  .empty{
    text-align:center;padding:60px 20px;color:#999;
  }
  .empty .big{font-size:2rem;margin-bottom:10px}

  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  @media (max-width:480px){
    body{padding:16px}
    .card{padding:24px 16px}
    .question{font-size:1.15rem}
    .section-title{font-size:1.7rem;letter-spacing:12px;text-indent:12px}
    .mode-bar{padding:0 16px 20px}
    .mode-btn{padding:6px 10px;font-size:.8rem}
  }
</style>
</head>
<body>
<div class="card" id="card">
  <h1 class="section-title" id="sectionTitle">漢字</h1>
  <div class="section-switch" id="sectionSwitch"></div>
  <div class="meta" id="meta"></div>
  <div class="question" id="question"></div>
  <div class="options" id="options"></div>
  <div id="feedback"></div>
  <div class="version" id="versionInfo"></div>
</div>

<div class="mode-bar" id="modeBar">
  <div class="mode-title">訓練模式</div>
  <div class="mode-buttons" id="modeButtons"></div>
</div>

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  if(currentMode === 'random'){
    // 全部隨機：所有題中隨機抽，盡量避免連續重複同一題
    do { q = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)]; }
    while(q.id === lastQid && QUESTIONS.length > 1);
  }
  else if(currentMode.startsWith('section-')){
    // 專項訓練：只在選定大類內隨機抽
    const sec = currentMode.replace('section-', '');
    const pool = QUESTIONS.filter(x => x.section === sec);
    if(!pool.length){
      $('question').innerHTML = `<div class="empty">「${sec}」暫無題目</div>`;
      return;
    }
    do { q = pool[Math.floor(Math.random() * pool.length)]; }
    while(q.id === lastQid && pool.length > 1);
  }
  else {
    // 大類輪詢（默認）
    while(!sectionQueue.length){
      const sec = SECTION_ORDER[sectionIdx % SECTION_ORDER.length];
      sectionIdx++;
      const pool = QUESTIONS.filter(x => x.section === sec);
      if(!pool.length) continue;
      if(sec !== currentSection){
        currentSection = sec;
        sectionSwitched = true;
      }
      sectionQueue = shuffle(pool);
    }
    q = sectionQueue.shift();
  }

  lastQid = q.id;
  picked = false;
  render(q);
}

function render(q){
  const sec = q.section || '';

  if(currentMode === 'cycle'){
    const totalInSection = QUESTIONS.filter(x => x.section === sec).length;
    const done = totalInSection - sectionQueue.length;
    $('sectionTitle').textContent = `${sec} · 第 ${done}/${totalInSection} 题`;
  }else if(currentMode.startsWith('section-')){
    const target = currentMode.replace('section-', '');
    const total = QUESTIONS.filter(x => x.section === target).length;
    $('sectionTitle').textContent = `${target} 專項 · ${total} 題`;
  }else{
    $('sectionTitle').textContent = '全部隨機';
  }

  // 大類輪詢切換時顯示提示
  const switchBox = $('sectionSwitch');
  if(currentMode === 'cycle' && sectionSwitched){
    switchBox.innerHTML = `<span class="tag">进入「${sec}」部分</span>`;
    sectionSwitched = false;
  }else{
    switchBox.innerHTML = '';
  }

  $('meta').innerHTML = [
    q.badge ? `<span>${q.badge}</span>` : '',
    q.source ? `<span>${q.source}</span>` : '',
    q.tag ? `<span>${q.tag}</span>` : ''
  ].filter(Boolean).join('');

  $('question').innerHTML = fmt(q.text);

  $('options').innerHTML = q.options.map((o,i)=>`
    <button class="option" data-i="${i}">
      <span class="letter">${LETTERS[i]}</span>
      <span>${fmt(o)}</span>
      <span class="mark"></span>
    </button>
  `).join('');
  $('feedback').innerHTML = '';

  document.querySelectorAll('.option').forEach(btn=>{
    btn.addEventListener('click', ()=>onPick(q, parseInt(btn.dataset.i,10)));
  });
}

function onPick(q, i){
  if(picked) return;
  picked = true;
  const ok = i === q.answer;

  document.querySelectorAll('.option').forEach(btn=>{
    const idx = parseInt(btn.dataset.i,10);
    btn.disabled = true;
    if(idx === q.answer){ btn.classList.add('correct'); btn.querySelector('.mark').textContent = '✓'; }
    else if(idx === i){ btn.classList.add('wrong'); btn.querySelector('.mark').textContent = '✗'; }
    else btn.classList.add('dim');
  });

  $('feedback').innerHTML = `
    <div class="feedback ${ok ? 'good' : 'bad'}">
      <div class="ans">${ok ? '✓ 正确' : `✗ 错误，正确答案是 ${LETTERS[q.answer]}`}</div>
      ${q.explain.map(p=>`<p>${fmt(p)}</p>`).join('')}
    </div>
    <button class="btn btn-primary" id="nextBtn">下一题</button>
    <div class="hint">快捷键：A/B/C/D 选题，Enter 下一题</div>
  `;
  $('nextBtn').addEventListener('click', pickNext);
  $('nextBtn').focus();
}

function setMode(mode){
  currentMode = mode;
  sectionQueue = [];
  sectionIdx = 0;
  currentSection = '';
  sectionSwitched = false;
  lastQid = null;
  updateModeButtons();
  pickNext();
}

function updateModeButtons(){
  const labels = [
    {key:'cycle', label:'全部輪詢'},
    {key:'random', label:'全部隨機'},
    {key:'section-漢字', label:'漢字'},
    {key:'section-字音', label:'字音'},
    {key:'section-字形', label:'字形'},
    {key:'section-標點', label:'標點'},
    {key:'section-成語', label:'成語'}
  ];
  $('modeButtons').innerHTML = labels.map(b=>`
    <button class="mode-btn ${currentMode === b.key ? 'active' : ''}" data-mode="${b.key}">${b.label}</button>
  `).join('');
  document.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>setMode(btn.dataset.mode));
  });
}

document.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  const map = {'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'a':0,'b':1,'c':2,'d':3,'e':4,'f':5};
  if(!picked && k in map){
    const btn = document.querySelector(`.option[data-i="${map[k]}"]`);
    if(btn) btn.click();
  }else if(picked && k === 'enter'){
    const nb = $('nextBtn');
    if(nb) nb.click();
  }
});

updateModeButtons();
pickNext();
</script>
</body>
</html>
